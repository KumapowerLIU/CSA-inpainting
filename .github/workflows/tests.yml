name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "2.6.0"
            torchvision: "0.21.0"
          - python: "3.12"
            torch: "2.14.1"
            torchvision: "0.29.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install "torch==${{ matrix.torch }}" "torchvision==${{ matrix.torchvision }}" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,perceptual]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - run: csa smoke --batch-size 2 --steps 2
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv lock --check

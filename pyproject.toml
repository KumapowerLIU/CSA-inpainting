[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-inpainting"
version = "0.2.0"
description = "Modern PyTorch implementation of Coherent Semantic Attention for Image Inpainting (ICCV 2019)"
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "numpy>=2.0,<3",
  "Pillow>=11",
  "PyYAML>=6",
  "scikit-image>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
csa = "csa_inpainting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
